<div class="container-fluid py-4 animate-fade-in mt-4 px-md-5 px-3">
  <div class="d-flex align-items-start gap-3 mb-4">
    <button type="button" class="btn back-btn mt-1" title="Volver" (click)="irAtras()">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <div>
      <h2 class="fw-bold text-dark mb-1">
        <i class="fa-solid fa-clipboard-list text-primary me-2"></i>
        Ver Tareas de Todos los Alumnos
      </h2>
      <p class="text-muted mb-0">Selecciona un alumno para ver y gestionar sus tareas.</p>
    </div>
  </div>

  <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
    <div class="card-body p-0">
      <app-shared-datatable
        tableId="tabla-tareas-todos"
        [dtOptions]="dtOptions"
        [columnTitles]="columnTitles"
        (actionClick)="onTableAction($event)">
      </app-shared-datatable>
    </div>
  </div>
</div>
