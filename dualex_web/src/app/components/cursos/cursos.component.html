<div class="container-fluid py-4 animate-fade-in mt-4">
  <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
    <div class="d-flex align-items-start gap-3">
      <a routerLink="/ciclos" class="btn btn-outline-secondary btn-sm cursos-back-btn mt-1" title="Volver a ciclos">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <div>
        <h2 class="fw-bold text-dark mb-1 cursos-title">
          <i class="fa-solid fa-graduation-cap text-primary me-2"></i>Gestión de Cursos
        </h2>
        <p class="text-muted mb-0 cursos-subtitle">Consulta y modifica los cursos disponibles</p>
      </div>
    </div>
  </div>

  <app-shared-datatable
    tableId="tabla-cursos"
    [dtOptions]="dtOptions"
    [columnTitles]="columnTitles"
    (actionClick)="handleAction($event)">
  </app-shared-datatable>
</div>

<app-confirmar-borrado-modal
  [visible]="isDeleteModalOpen"
  [titulo]="'Eliminar Curso'"
  [mensaje]="'¿Estás seguro de que deseas eliminar el curso ' + (cursoToDelete?.nombre ?? '') + '? Esta acción no se puede deshacer.'"
  [palabraClave]="'confirmar'"
  (confirmarEvent)="confirmarEliminar()"
  (cancelarEvent)="cerrarDeleteModal()">
</app-confirmar-borrado-modal>

@if (isEditModalOpen) {
<div class="custom-modal-overlay" (click)="cerrarEditModal()">
  <div class="custom-modal form-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3 class="modal-title m-0 fw-bold">{{ isEditing ? 'Editar curso' : 'Añadir curso' }}</h3>
      <button class="btn-close-custom" (click)="cerrarEditModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="modal-body-container">
      <label class="form-label">Ciclo:</label>
      <div class="d-flex gap-3 mb-3 flex-wrap">
        <label class="d-flex align-items-center gap-2 m-0"><input type="radio" name="tipoCiclo" value="existente" [(ngModel)]="tipoCiclo" (change)="actualizarSiglas()"> Existente</label>
        <label class="d-flex align-items-center gap-2 m-0"><input type="radio" name="tipoCiclo" value="nuevo" [(ngModel)]="tipoCiclo" (change)="actualizarSiglas()"> Nuevo</label>
      </div>

      @if (tipoCiclo === 'existente') {
        <select class="form-select mb-3" [(ngModel)]="cursoForm.cicloExistente" (change)="actualizarSiglas()">
          <option value="" disabled selected>Selecciona un ciclo...</option>
          @for (ciclo of ciclosExistentes; track ciclo.nombre) {
            <option [value]="ciclo.nombre">{{ ciclo.nombre }}</option>
          }
        </select>
      } @else {
        <div class="row mb-2 align-items-center">
          <div class="col-4"><label>Nombre:</label></div>
          <div class="col-8"><input type="text" class="form-control form-control-sm" [(ngModel)]="cursoForm.nombreCiclo" placeholder="Desarrollo de Aplicaciones Web"></div>
        </div>
        <div class="row mb-2 align-items-center">
          <div class="col-4"><label>Siglas:</label></div>
          <div class="col-8"><input type="text" class="form-control form-control-sm" [(ngModel)]="cursoForm.siglasCiclo" placeholder="DAW" (input)="actualizarSiglas()"></div>
        </div>
        <div class="row mb-2 align-items-center">
          <div class="col-4"><label>Grado:</label></div>
          <div class="col-8 d-flex gap-3">
            <label class="m-0"><input type="radio" name="grado" value="Medio" [(ngModel)]="cursoForm.grado"> Medio</label>
            <label class="m-0"><input type="radio" name="grado" value="Superior" [(ngModel)]="cursoForm.grado"> Superior</label>
          </div>
        </div>
        <div class="row mb-2 align-items-center">
          <div class="col-4"><label>Año escolar:</label></div>
          <div class="col-8"><input type="text" class="form-control form-control-sm" [(ngModel)]="cursoForm.anoEscolar" placeholder="25-26"></div>
        </div>
      }
    </div>

    <div style="padding-left: 10px; text-align: left;">
      <div class="row mb-3 align-items-center">
        <div class="col-4"><label>Curso (1º, 2º):</label></div>
        <div class="col-6">
          <select class="form-select form-select-sm" [(ngModel)]="cursoForm.curso" (change)="actualizarSiglas()">
            <option value="" disabled selected>Selecciona...</option>
            <option value="1">1º</option>
            <option value="2">2º</option>
          </select>
        </div>
      </div>
      <div class="row mb-3 align-items-center">
        <div class="col-4"><label>Siglas:</label></div>
        <div class="col-6"><input type="text" class="form-control form-control-sm" [(ngModel)]="cursoForm.siglasCurso" placeholder="1º DAW"></div>
      </div>
      <div class="row mb-3 align-items-center">
        <div class="col-4"><label>Color fondo:</label></div>
        <div class="col-2"><input type="color" class="form-control form-control-color p-0 border-0" [(ngModel)]="cursoForm.colorFondo"></div>
      </div>
      <div class="row mb-4 align-items-center">
        <div class="col-4"><label>Color texto:</label></div>
        <div class="col-2"><input type="color" class="form-control form-control-color p-0 border-0" [(ngModel)]="cursoForm.colorTexto"></div>
      </div>
    </div>

    <div class="modal-actions mt-4 d-flex justify-content-center gap-4">
      <button class="btn-modal btn-salir px-4" (click)="cerrarEditModal()">CANCELAR</button>
      <button class="btn-modal btn-aceptar px-4" (click)="guardarCurso()">ACEPTAR</button>
    </div>
  </div>
</div>
}
