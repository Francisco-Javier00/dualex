<div class="container-fluid py-4 animate-fade-in mt-4 px-md-5 px-3">
  <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
    <div class="d-flex align-items-start gap-3">
      <a routerLink="/dashboard" class="btn back-btn mt-1" title="Volver">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <div>
        <h2 class="fw-bold text-dark mb-1 profesores-title">
          <i class="fa-solid fa-chalkboard-user text-primary me-2"></i>Registro de Profesores
        </h2>
        <p class="text-muted mb-0 profesores-subtitle">Selecciona un profesor para gestionar</p>
      </div>
    </div>

    <div class="d-flex flex-wrap gap-3">
      <input
        id="profesores-excel-input"
        type="file"
        accept=".xls,.xlsx"
        class="d-none"
        (change)="onExcelSeleccionado($event)">
      <button class="btn btn-outline-primary px-4 shadow-sm profesores-action-secondary" (click)="subirExcel()">
        <i class="fa-solid fa-file-excel me-2"></i> Importar Excel
      </button>
      <button class="btn btn-primary px-4 shadow-sm profesores-action-primary" (click)="crearNuevaEntrada()">
        <i class="fa-solid fa-user-plus me-2"></i> Nuevo Profesor
      </button>
    </div>
  </div>

  <app-shared-datatable
    tableId="tabla-profesores"
    [dtOptions]="dtOptions"
    [columnTitles]="['Nombre', 'Apd', 'Correo', 'ROL', 'Modulos', 'Ciclos', 'Acciones']"
    (actionClick)="onTableAction($event)">
  </app-shared-datatable>
</div>

@if (modalCrearVisible) {
  <app-profesor-modal
    [modo]="modoFormulario"
    [profesor]="profesorSeleccionado"
    (guardar)="onGuardarProfesor($event)"
    (cancelar)="onCancelarCreacion()">
  </app-profesor-modal>
}

@if (modalBorradoVisible) {
  <app-confirmar-borrado-modal
    [visible]="modalBorradoVisible"
    [titulo]="'Eliminar Profesor'"
    [mensaje]="'¿Estás seguro de que deseas eliminar al profesor <strong>' + (profesorSeleccionado?.nombre + ' ' + profesorSeleccionado?.apellidos) + '</strong>?'"

    [palabraClave]="'confirmar'"
    (confirmarEvent)="onConfirmarBorrado()"
    (cancelarEvent)="onCancelarBorrado()">
  </app-confirmar-borrado-modal>
}
