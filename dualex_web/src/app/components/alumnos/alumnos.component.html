<div class="container-fluid py-5 text-center animate-fade-in">
  <div class="py-5 mt-5">
    <i class="fa-solid fa-user-graduate fs-1 text-primary mb-4"></i>
    <h2 class="fw-bold text-dark">Gestión de Alumnos</h2>
    <h4 *ngIf="ciclo && curso" class="text-primary mt-3">
      Filtrado por: {{curso}}º {{ciclo}}
    </h4>
    <p class="text-muted mt-3">Vista en desarrollo. Aquí aparecerá el listado y seguimiento de todos los estudiantes.</p>
    <a routerLink="/" class="btn btn-primary-light mt-4 px-4 py-2">
      <i class="fa-solid fa-arrow-left me-2"></i> Volver al Inicio
    </a>
  </div>
</div>
