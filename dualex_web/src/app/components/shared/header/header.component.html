<header class="navbar navbar-expand-lg bg-white border-bottom fixed-top py-3 px-4" style="height: 80px;">
  <div class="container-fluid d-flex justify-content-between align-items-center h-100">
    <a class="navbar-brand d-flex align-items-center gap-0" routerLink="/" title="Inicio" style="line-height: 1;">
      <img src="/dualex-logo.svg" alt="Logo Dualex" style="height: 50px; margin-right: -2px; margin-bottom: 17px;">
      <span class="fw-bold fst-italic fs-3" style="color: #006293; margin-top: 5px;">UALEX</span>
    </a>

    @if (usuario$ | async; as usuario) {
    <div class="d-flex align-items-center gap-3">
      <div class="text-end lh-1">
        <div class="small fw-bold text-dark mb-1">{{ usuario.nombre }} {{ usuario.apellidos }}</div>
        <span class="badge rounded-1 text-white" [ngClass]="'badge-' + usuario.rol.toLowerCase()"
          style="font-size: 0.7rem;">
          {{ usuario.rol }}
        </span>
      </div>

      <button type="button" (click)="irAPerfil()" class="avatar text-white d-flex align-items-center justify-content-center rounded-circle fw-bold text-decoration-none border-0"
        [ngClass]="'badge-' + usuario.rol.toLowerCase()"
        style="width: 38px; height: 38px; font-size: 1.1rem; cursor: pointer;" title="Perfil">
        {{ usuario.nombre.substring(0, 1).toUpperCase() }}
      </button>

      <div class="vr mx-2" style="height: 32px;"></div>

      <button class="btn btn-link text-secondary p-1 fs-4 Sharp lh-1" title="Ayuda">
        <i class="fa-solid fa-question"></i>
      </button>

      <button class="btn btn-link text-secondary p-1 fs-4 lh-1" title="Cerrar Sesion" type="button" (click)="cerrarSesion()">
        <i class="fa-solid fa-sign-out-alt"></i>
      </button>
    </div>
    }
  </div>
</header>
