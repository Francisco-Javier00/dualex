<div class="container-fluid py-4 animate-fade-in mt-4 px-md-5 px-3">
  <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
    <div class="d-flex align-items-start gap-3">
      <a routerLink="/dashboard" class="btn back-btn mt-1" title="Volver">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <div>
        <h2 class="fw-bold text-dark mb-1 ciclos-title">
          <i class="fa-solid fa-layer-group text-primary me-2"></i>Registro de Ciclos
        </h2>
        <p class="text-muted mb-0 ciclos-subtitle">Consulta y gestiona los ciclos formativos disponibles</p>
      </div>
    </div>

    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-primary btn-lg ciclos-action-primary" (click)="abrirEditModal()">
        <i class="fa-solid fa-circle-plus me-2"></i>Crear nueva entrada
      </button>
    </div>
  </div>

  <app-shared-datatable
    tableId="tabla-ciclos"
    [dtOptions]="dtOptions"
    [columnTitles]="columnTitles"
    (actionClick)="handleAction($event)">
  </app-shared-datatable>
</div>

<app-confirmar-borrado-modal
  [visible]="isDeleteModalOpen"
  [titulo]="'Eliminar Ciclo'"
  [mensaje]="'¿Estás seguro de que deseas eliminar el ciclo ' + (cicloToDelete?.nombre ?? '') + '? Esta acción no se puede deshacer.'"
  [palabraClave]="'confirmar'"
  (confirmarEvent)="confirmarEliminar()"
  (cancelarEvent)="cerrarDeleteModal()">
</app-confirmar-borrado-modal>

@if (isEditModalOpen) {
<div class="custom-modal-overlay" (click)="cerrarEditModal()">
  <div class="custom-modal animate-slide-up" (click)="$event.stopPropagation()">
    
    <!-- CABECERA -->
    <div class="modal-header">
      <h5 class="modal-title">
        <i class="fa-solid" [ngClass]="isEditing ? 'fa-layer-group text-primary' : 'fa-circle-plus text-success'"></i>
        {{ isEditing ? 'Modificar Ciclo' : 'Nuevo Ciclo' }}
      </h5>
      <button class="btn-close-custom" (click)="cerrarEditModal()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- CUERPO -->
    <div class="modal-body py-4">
      <div class="row g-3">
        
        <!-- Nombre -->
        <div class="col-12">
          <label class="form-label small fw-bold text-uppercase opacity-75">Nombre del Ciclo</label>
          <div class="input-group shadow-sm border">
            <span class="input-group-text"><i class="fa-solid fa-font text-muted"></i></span>
            <input type="text" class="form-control border-0 px-3" [(ngModel)]="cicloForm.nombre" maxlength="100" placeholder="Ej: Desarrollo de Aplicaciones Web">
          </div>
        </div>

        <!-- Siglas -->
        <div class="col-md-6">
          <label class="form-label small fw-bold text-uppercase opacity-75">Siglas</label>
          <div class="input-group shadow-sm border">
            <span class="input-group-text"><i class="fa-solid fa-tag text-muted"></i></span>
            <input type="text" class="form-control border-0 px-3 text-uppercase" [(ngModel)]="cicloForm.siglas" 
                   (input)="cicloForm.siglas = cicloForm.siglas.toUpperCase()" maxlength="5" placeholder="Ej: DAW">
          </div>
        </div>

        <!-- Grado -->
        <div class="col-md-6">
          <label class="form-label small fw-bold text-uppercase opacity-75">Grado Formativo</label>
          <div class="d-flex align-items-center gap-3 mt-2 h-100">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="grado" id="gradoMedio" value="medio" [(ngModel)]="cicloForm.grado">
              <label class="form-check-label small" for="gradoMedio">Medio</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="grado" id="gradoSuperior" value="superior" [(ngModel)]="cicloForm.grado">
              <label class="form-check-label small" for="gradoSuperior">Superior</label>
            </div>
          </div>
        </div>

        <!-- Cursos (Calculado) -->
        <div class="col-12">
          <label class="form-label small fw-bold text-uppercase opacity-75">Cursos Generados</label>
          <div class="input-group shadow-sm border bg-light">
            <span class="input-group-text bg-light"><i class="fa-solid fa-graduation-cap text-muted"></i></span>
            <input type="text" class="form-control border-0 px-3 bg-light" [value]="formatearCursos(cicloForm.siglas)" disabled>
          </div>
        </div>

      </div>

      <!-- ACCIONES -->
      <div class="d-flex gap-3 mt-5">
        <button type="button" class="btn-modal-cancelar flex-grow-1" (click)="cerrarEditModal()">
          Cancelar
        </button>
        <button type="button" class="btn-modal-aceptar flex-grow-1" (click)="guardarCiclo()">
          <i class="fa-solid fa-save me-2"></i> {{ isEditing ? 'Guardar Cambios' : 'Registrar Ciclo' }}
        </button>
      </div>
    </div>
  </div>
</div>
}
