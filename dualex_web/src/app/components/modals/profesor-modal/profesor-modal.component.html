<div class="modal-overlay">
  <div class="modal-content animate-slide-up" (click)="$event.stopPropagation()">

    <!-- CABECERA -->
    <div class="modal-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0 fw-bold text-dark">
        <i class="fa-solid text-primary me-2" [ngClass]="modo === 'editar' ? 'fa-user-pen' : 'fa-user-plus'"></i>
        {{ modo === 'editar' ? 'Modificar Profesor' : 'Registrar Nuevo Profesor' }}
      </h5>
      <button class="btn-close" (click)="cancelar.emit()"></button>
    </div>

    <!-- CUERPO -->
    <div class="modal-body py-4">
      <form [formGroup]="profesorForm">
        <div class="row g-4">

          <!-- INFORMACIÓN PERSONAL -->
          <div class="col-12">
            <h6 class="text-primary text-uppercase small fw-bold mb-3">Información Personal</h6>
            
            <div class="d-flex flex-column gap-3">
              <!-- Nombre -->
              <div>
                <label class="form-label small fw-bold text-uppercase opacity-75">Nombre</label>
                <div class="input-group shadow-sm rounded-3 overflow-hidden border"
                     [class.is-invalid]="profesorForm.get('nombre')?.touched && profesorForm.get('nombre')?.invalid">
                  <span class="input-group-text bg-white border-0"><i class="fa-solid fa-user text-muted"></i></span>
                  <input type="text" formControlName="nombre" class="form-control border-0 px-3" placeholder="Ej: Juan Carlos"
                         [class.is-invalid]="profesorForm.get('nombre')?.touched && profesorForm.get('nombre')?.invalid">
                </div>
                <div class="text-danger small mt-1"
                     *ngIf="profesorForm.get('nombre')?.touched && profesorForm.get('nombre')?.errors?.['required']">
                  El nombre es obligatorio
                </div>
              </div>

              <!-- Apellidos -->
              <div>
                <label class="form-label small fw-bold text-uppercase opacity-75">Apellidos</label>
                <div class="input-group shadow-sm rounded-3 overflow-hidden border"
                     [class.is-invalid]="profesorForm.get('apellidos')?.touched && profesorForm.get('apellidos')?.invalid">
                  <span class="input-group-text bg-white border-0"><i class="fa-solid fa-signature text-muted"></i></span>
                  <input type="text" formControlName="apellidos" class="form-control border-0 px-3" placeholder="Ej: García López"
                         [class.is-invalid]="profesorForm.get('apellidos')?.touched && profesorForm.get('apellidos')?.invalid">
                </div>
                <div class="text-danger small mt-1"
                     *ngIf="profesorForm.get('apellidos')?.touched && profesorForm.get('apellidos')?.errors?.['required']">
                  Los apellidos son obligatorios
                </div>
              </div>

              <!-- Correo -->
              <div>
                <label class="form-label small fw-bold text-uppercase opacity-75">Correo electrónico</label>
                <div class="input-group shadow-sm rounded-3 overflow-hidden border"
                     [class.is-invalid]="profesorForm.get('correo')?.touched && profesorForm.get('correo')?.invalid">
                  <span class="input-group-text bg-white border-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                  <input type="email" formControlName="correo" class="form-control border-0 px-3" placeholder="correo@dualex.es"
                         [class.is-invalid]="profesorForm.get('correo')?.touched && profesorForm.get('correo')?.invalid">
                </div>
                <div class="text-danger small mt-1"
                     *ngIf="profesorForm.get('correo')?.touched && profesorForm.get('correo')?.errors">
                  <span *ngIf="profesorForm.get('correo')?.errors?.['required']">El correo es obligatorio</span>
                  <span *ngIf="profesorForm.get('correo')?.errors?.['pattern']">Formato no válido (ej: usuario&#64;dominio.com)</span>
                </div>
              </div>

              <!-- Rol -->
              <div *ngIf="modo === 'editar'">
                <label class="form-label small fw-bold text-uppercase opacity-75">Rol</label>
                <div class="input-group shadow-sm rounded-3 overflow-hidden border"
                     [class.is-invalid]="profesorForm.get('rol')?.touched && profesorForm.get('rol')?.invalid">
                  <span class="input-group-text bg-white border-0"><i class="fa-solid fa-shield-halved text-muted"></i></span>
                    <select class="form-select border-0 px-3" formControlName="rol" (change)="onRolChange(profesorForm.get('rol')?.value)"
                            [class.is-invalid]="profesorForm.get('rol')?.touched && profesorForm.get('rol')?.invalid">
                      <option value="PROFESOR">Profesor</option>
                      <option value="COORDINADOR">Coordinador</option>
                    </select>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ACCIONES -->
        <div class="d-flex gap-2 mt-5">
          <button type="button" class="btn btn-light border flex-grow-1 py-2 shadow-sm rounded-3 fw-bold text-secondary" (click)="cancelar.emit()">
            Cancelar
          </button>
          <button type="button" class="btn btn-primary flex-grow-1 py-2 shadow-sm rounded-3 fw-bold" (click)="onGuardar()">
            <i class="fa-solid fa-save me-2"></i> {{ modo === 'editar' ? 'Guardar Cambios' : 'Registrar Profesor' }}
          </button>
        </div>
      </form>
    </div>

  </div>
</div>
