<div class="modal-overlay">
  <div class="modal-content animate-slide-up" (click)="$event.stopPropagation()">
    
    <!-- CABECERA -->
    <div class="modal-header">
      <h5 class="modal-title">
        <i class="fa-solid" [ngClass]="modo === 'editar' ? 'fa-layer-group text-primary' : 'fa-circle-plus text-success'"></i>
        {{ modo === 'editar' ? 'Modificar Ciclo' : 'Nuevo Ciclo' }}
      </h5>
      <button class="btn btn-close" (click)="cancelar.emit()"></button>
    </div>

    <!-- CUERPO -->
    <div class="modal-body py-4">
      <form [formGroup]="cicloForm">
        <div class="row g-3">
          
          <!-- Nombre -->
          <div class="col-12">
            <label class="form-label small fw-bold text-uppercase opacity-75">Nombre del Ciclo</label>
            <div class="input-group shadow-sm border"
                 [class.is-invalid]="cicloForm.get('nombre')?.touched && cicloForm.get('nombre')?.invalid">
              <span class="input-group-text"><i class="fa-solid fa-font text-muted"></i></span>
              <input type="text" class="form-control border-0 px-3" formControlName="nombre" maxlength="100" placeholder="Ej: Desarrollo de Aplicaciones Web"
                     [class.is-invalid]="cicloForm.get('nombre')?.touched && cicloForm.get('nombre')?.invalid">
            </div>
            <div class="text-danger small mt-1"
                 *ngIf="cicloForm.get('nombre')?.touched && cicloForm.get('nombre')?.errors?.['required']">
              El nombre del ciclo es obligatorio
            </div>
          </div>

          <!-- Siglas -->
          <div class="col-md-6">
            <label class="form-label small fw-bold text-uppercase opacity-75">Siglas</label>
            <div class="input-group shadow-sm border"
                 [class.is-invalid]="cicloForm.get('siglas')?.touched && cicloForm.get('siglas')?.invalid">
              <span class="input-group-text"><i class="fa-solid fa-tag text-muted"></i></span>
              <input type="text" class="form-control border-0 px-3 text-uppercase" formControlName="siglas" 
                     (input)="cicloForm.get('siglas')?.setValue(cicloForm.get('siglas')?.value.toUpperCase())" maxlength="5" placeholder="Ej: DAW"
                     [class.is-invalid]="cicloForm.get('siglas')?.touched && cicloForm.get('siglas')?.invalid">
            </div>
            <div class="text-danger small mt-1"
                 *ngIf="cicloForm.get('siglas')?.touched && cicloForm.get('siglas')?.errors?.['required']">
              Las siglas son obligatorias
            </div>
          </div>

          <!-- Grado -->
          <div class="col-md-6">
            <label class="form-label small fw-bold text-uppercase opacity-75">Grado Formativo</label>
            <div class="input-group shadow-sm border rounded-3 d-flex align-items-center bg-white px-3" style="height: 42px;">
              <span class="me-3 text-muted"><i class="fa-solid fa-graduation-cap"></i></span>
              <div class="form-check me-4 mb-0 d-flex align-items-center gap-2">
                <input class="form-check-input mt-0 cursor-pointer" type="radio" name="grado" id="gradoMedio" value="medio" formControlName="grado" style="width: 1.1rem; height: 1.1rem;">
                <label class="form-check-label small cursor-pointer fw-semibold text-secondary" for="gradoMedio">Medio</label>
              </div>
              <div class="form-check mb-0 d-flex align-items-center gap-2">
                <input class="form-check-input mt-0 cursor-pointer" type="radio" name="grado" id="gradoSuperior" value="superior" formControlName="grado" style="width: 1.1rem; height: 1.1rem;">
                <label class="form-check-label small cursor-pointer fw-semibold text-secondary" for="gradoSuperior">Superior</label>
              </div>
            </div>
          </div>

          <!-- Cursos (Calculado) -->
          <div class="col-12">
            <label class="form-label small fw-bold text-uppercase opacity-75">Cursos Generados</label>
            <div class="input-group shadow-sm border bg-light">
              <span class="input-group-text bg-light"><i class="fa-solid fa-graduation-cap text-muted"></i></span>
              <input type="text" class="form-control border-0 px-3 bg-light" [value]="formatearCursos(cicloForm.get('siglas')?.value || '')" disabled>
            </div>
          </div>

        </div>

        <!-- ACCIONES -->
        <div class="d-flex gap-3 mt-5">
          <button type="button" class="btn-modal-cancelar flex-grow-1" (click)="cancelar.emit()">
            Cancelar
          </button>
          <button type="button" class="btn-modal-aceptar flex-grow-1" (click)="onGuardar()">
            <i class="fa-solid fa-save me-2"></i> {{ modo === 'editar' ? 'Guardar Cambios' : 'Registrar Ciclo' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
