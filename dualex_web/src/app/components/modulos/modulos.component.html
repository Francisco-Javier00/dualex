<div class="container-fluid py-4 animate-fade-in mt-4 px-md-5 px-3">
  <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
    <div class="d-flex align-items-start gap-3">
      <a routerLink="/dashboard" class="btn back-btn mt-1" title="Volver">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <div>
        <h2 class="fw-bold text-dark mb-1">
          <i class="fa-solid fa-book text-primary me-2"></i> Gestión de Módulos
        </h2>
        <p class="text-muted mb-0">Configura y administra los módulos formativos del sistema</p>
      </div>
    </div>
    <button class="btn btn-primary shadow-sm" (click)="crearNuevo()">
      <i class="fa-solid fa-plus me-1"></i> Nuevo Módulo
    </button>
  </div>

  <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
    <div class="card-body p-0">
      <app-shared-datatable
        tableId="tabla-modulos"
        [dtOptions]="dtOptions"
        [columnTitles]="['Nombre del Módulo', 'Siglas', 'Ciclo Formativo', 'Acciones']"
        (actionClick)="onTableAction($event)">
      </app-shared-datatable>
    </div>
  </div>
</div>

<!-- Modal de confirmación de borrado -->
<app-confirmar-borrado-modal
  [visible]="modalBorradoVisible"
  [titulo]="'Eliminar Módulo'"
  [mensaje]="'¿Estás seguro de que deseas eliminar el módulo &quot;' + (moduloSeleccionado?.nombre ?? '') + '&quot;? Esta acción no se puede deshacer.'"
  [palabraClave]="'confirmar'"
  (confirmarEvent)="onConfirmarBorrado()"
  (cancelarEvent)="onCancelarBorrado()">
</app-confirmar-borrado-modal>

<!-- Modal de creación/edición de módulos -->
<app-modulo-modal
  [(visible)]="modalModuloVisible"
  [modulo]="moduloSeleccionado"
  (guardarEvent)="onGuardarModulo($event)">
</app-modulo-modal>
